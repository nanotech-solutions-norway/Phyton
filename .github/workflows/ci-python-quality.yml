name: CI - Python Quality Gate

on:
  push:
    branches: [ main ]
    paths:
      - "python/**"
      - ".github/workflows/*.yml"
      - "docs/**"
      - "README.md"
  pull_request:
    branches: [ main ]
    paths:
      - "python/**"
      - ".github/workflows/*.yml"
      - "docs/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  python-quality:
    name: Python quality gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            python/requirements.txt
            python/requirements-dev.txt

      - name: Install Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r python/requirements.txt
          python -m pip install -r python/requirements-dev.txt

      - name: Run Ruff format check
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff format --check python

      - name: Run Ruff lint
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff check python

      - name: Run mypy typing validation
        shell: bash
        run: |
          set -euo pipefail
          python -m mypy python/scripts python/tools

      - name: Run pytest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p TestResults/python
          python -m pytest python/tests --junitxml=TestResults/python/pytest-results.xml

      - name: Upload Python test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-quality-test-results
          path: TestResults/python/*.xml
          if-no-files-found: warn
